services:
  db:
    image: postgres:16-alpine
    container_name: tedarik-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tedarik
      POSTGRES_PASSWORD: tedarik
      POSTGRES_DB: tedarik_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
