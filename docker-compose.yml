services:
  db:
    image: mariadb:11.8
    container_name: tedarik-crm-db
    restart: unless-stopped
    environment:
      MARIADB_USER: tedarik
      MARIADB_PASSWORD: tedarik
      MARIADB_DATABASE: tedarik_crm
      MARIADB_ROOT_PASSWORD: tedarik-root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
